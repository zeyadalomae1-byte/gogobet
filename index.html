<!DOCTYPE html>

<head>

<title>GogoBet - Kazanmaya Hazır Ol!</title>
<style>
*{box-sizing:border-box}
body{

header{
 background:#080d09;padding:20px;
 display:flex;justify-content:space-between;

}
.logo{font-size:27px;font-weight:bold;color:#39ff14}

.match button{width:100%;margin-top:10px}
footer{text-align:center;padding:25px;color:#888}

<header>

<div class="container">

<footer>
 GogoBet © 2026
</footer>

</html>
